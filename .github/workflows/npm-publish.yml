name: Publish OpenLegal to npm

on:
  workflow_run:
    workflows:
      - Foundation CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Confirm the successful CI run is still current main
        id: current_main
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not safely read current main SHA." >&2
            exit 1
          fi
          if [[ "$current_sha" != "$TESTED_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI run for $TESTED_SHA; main is now $current_sha."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        if: steps.current_main.outputs.publish == 'true'
        run: npm install --global npm@11.5.1
      - name: Check whether this version is already published
        id: version
        if: steps.current_main.outputs.publish == 'true'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          set +e
          result="$(npm view "openlegal@${version}" version --fetch-retries=0 --fetch-timeout=10000 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "openlegal@${version} is already on npm; skipping."
          elif grep -q 'E404' <<< "$result"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "openlegal@${version} is not published; preparing release."
          else
            echo "$result"
            echo "Could not safely determine whether openlegal@${version} is published." >&2
            exit 1
          fi
      - name: Publish new stable or prerelease version
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi
          npm publish --access public --tag "$tag"
