name: Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s mcp -p 'test_*.py'
      - run: npm run check:syntax
      - run: npm run validate
      - run: npm run audit:secrets
      - name: Enforce review status transitions
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run audit:review-transitions
      - name: Verify DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Audit external source links on trusted pushes
        if: github.event_name == 'push'
        run: npm run audit:links
        env:
          OLM_LINK_AUDIT_TIMEOUT_MS: 5000
          OLM_LINK_AUDIT_RETRIES: 0
      - run: npm run audit:internal-links
      - run: npm run audit:accessibility
      - run: npm run audit:privacy
      - run: npm test
      - run: npm run build:api
      - run: npm run build:review-packets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Exercise advisory OpenLegal Action
        id: openlegal_scan
        uses: ./.github/actions/openlegal-scan
        with:
          path: tests/fixtures
          language: en
      - name: Verify advisory report was added to the job summary
        env:
          REPORT_WRITTEN: ${{ steps.openlegal_scan.outputs.report_written }}
        run: test "$REPORT_WRITTEN" = true
      - name: Upload prepared review packets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: legal-language-review-packets
          path: dist/review-packets/
          if-no-files-found: error
          retention-days: 90
