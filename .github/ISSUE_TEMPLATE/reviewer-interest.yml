name: Reviewer or moderator interest
description: Volunteer as a legal reviewer, language reviewer, legal researcher, or community moderator.
title: "[Volunteer interest]: "
labels: ["community"]
body:
  - type: markdown
    attributes:
      value: >-
        This issue and its replies are public. Do not include private contact details,
        identity documents, client matters, privileged advice, confidential files, or credentials.
        Submitting this form does not appoint you or grant review authority.
  - type: checkboxes
    id: roles
    attributes:
      label: Volunteer role(s)
      options:
        - label: Moroccan legal review
        - label: English, French, or Arabic language review
        - label: Legal source research and verification
        - label: Community moderation
        - label: Other contribution
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Public profile or qualification reference (optional)
      description: Link a public professional profile, publication, or qualification page if you want. Do not upload identity documents.
      placeholder: https://...
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Relevant experience and possible review scope
      description: Briefly describe relevant practice, research, language expertise, or moderation experience. State the areas or languages you could cover and any limits.
      placeholder: Keep this high-level; do not include client or confidential information.
    validations:
      required: true
  - type: textarea
    id: conflicts
    attributes:
      label: Independence or potential conflicts
      description: Note any relevant relationship or conflict for the scope you propose. You may answer "to discuss privately with maintainers"; do not disclose sensitive details here.
    validations:
      required: true
  - type: input
    id: availability
    attributes:
      label: Availability (optional)
      description: A rough estimate is sufficient; do not share private contact information.
    validations:
      required: false
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I understand this issue is public and that an expression of interest does not appoint me or change any review status.
    validations:
      required: true
