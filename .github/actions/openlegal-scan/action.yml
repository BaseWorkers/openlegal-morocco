name: OpenLegal advisory scan
description: Run the local OpenLegal Node.js and TypeScript indicator scan and add an advisory report to the job summary.
outputs:
  report_written:
    description: Whether a valid Markdown report was appended to this step summary.
    value: ${{ steps.scan.outputs.report_written }}
inputs:
  path:
    description: Repository directory to scan, relative to the workspace.
    required: false
    default: .
  language:
    description: Report language (en, fr, or ar).
    required: false
    default: en
  url:
    description: Optional public HTTPS URL for bounded HTML inspection.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Generate advisory scan report
      id: scan
      shell: bash
      env:
        OPENLEGAL_SCAN_PATH: ${{ inputs.path }}
        OPENLEGAL_SCAN_LANGUAGE: ${{ inputs.language }}
        OPENLEGAL_SCAN_URL: ${{ inputs.url }}
      run: |
        set +e
        report="$(mktemp)"
        error_file="$(mktemp)"
        trap 'rm -f "$report" "$error_file"' EXIT
        args=(scan "$OPENLEGAL_SCAN_PATH" --language "$OPENLEGAL_SCAN_LANGUAGE")
        if [ -n "$OPENLEGAL_SCAN_URL" ]; then
          args+=(--url "$OPENLEGAL_SCAN_URL")
        fi
        node "$GITHUB_ACTION_PATH/../../../scripts/openlegal.mjs" "${args[@]}" >"$report" 2>"$error_file"
        status=$?
        if [ "$status" -eq 0 ] && grep -q '^# ' "$report"; then
          if cat "$report" >> "$GITHUB_STEP_SUMMARY"; then
            echo 'report_written=true' >> "$GITHUB_OUTPUT"
          else
            echo 'report_written=false' >> "$GITHUB_OUTPUT"
          fi
        else
          {
            echo '## OpenLegal advisory scan'
            echo
            echo 'The scan could not produce a report. This advisory action does not block the workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'report_written=false' >> "$GITHUB_OUTPUT"
        fi
        exit 0
