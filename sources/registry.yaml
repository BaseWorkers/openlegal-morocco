      "notes": "The 5-page PDF is titled Deliberation No. D-939-2025 dated 28 November 2025 and is signed by the CNDP President. It cites Article 28 of Law 09-08 and Decree 2-09-165. Sections 1–8 address processing personal data by installing, recording, or storing cookies on a user's terminal; they provide a simplified-declaration model, list purposes, require prior authorization for personal profiling, set a six-month maximum retention period, distinguish consent for personalized advertising and social-network sharing from the other listed purposes, state information to communicate before the first cookie deposit and a duty to communicate changes, and state security/confidentiality and subcontractor guarantees. Sections 9–10 state prior-CNDP-authorization requirements for foreign transfers of cookie data and interconnections with different purposes. The record verifies what this official PDF states only. Its formal publication, legal effect, current status, scope beyond the decision's text, and reconciliation with the 2009 statute, the older CNDP website guide, and other CNDP decisions remain unresolved. Do not infer that the decision resolves all cookies, similar technologies, or every processing scenario.",
